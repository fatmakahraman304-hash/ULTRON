name: ULTRONMobile
options:
  bundleIdPrefix: com.ultron
  deploymentTarget:
    iOS: "18.0"

targets:
  ULTRONMobile:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: ULTRON
        NSMicrophoneUsageDescription: ULTRON, sürekli sesli komutları dinlemek ve seninle konuşmak için mikrofona erişir.
        UIBackgroundModes:
          - audio
        UIApplicationSupportsIndirectInputEvents: true
        LSApplicationQueriesSchemes:
          - youtube
          - spotify
          - whatsapp
          - instagram
          - googlechrome
          - facetime
        CFBundleURLTypes:
          - CFBundleURLName: com.ultron.mobile
            CFBundleURLSchemes:
              - ultron
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ultron.mobile
        SWIFT_VERSION: 5.10
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 3
    scheme:
      testTargets: []
