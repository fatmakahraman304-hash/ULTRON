<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090909" />
  <title>ULTRON Cloud</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box} body{margin:0;background:#050505;color:#f4f4f4;min-height:100vh}
    .shell{max-width:780px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
    header{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 12px;border-bottom:1px solid #2a1111}
    h1{font-size:19px;letter-spacing:.22em;margin:0;color:#ff4d4d}.status{font-size:12px;color:#9b9b9b}
    .panel{background:#0b0b0b;border:1px solid #261010;border-radius:18px;padding:14px;margin-top:14px;box-shadow:0 0 40px rgba(160,0,0,.08)}
    #login{margin:auto 0}.hidden{display:none!important}input,textarea,button{font:inherit}
    input,textarea{width:100%;border:1px solid #3a1717;border-radius:12px;background:#111;color:#fff;padding:12px;outline:none}
    button{border:0;border-radius:12px;background:#8f1111;color:white;padding:12px 16px;font-weight:700;cursor:pointer}button.secondary{background:#1b1b1b;color:#ddd;border:1px solid #333}
    .row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.grow{flex:1}
    #app{display:flex;flex-direction:column;min-height:calc(100vh - 80px)}
    #messages{flex:1;overflow:auto;padding:16px 0 110px;display:flex;flex-direction:column;gap:10px}
    .msg{max-width:88%;padding:11px 13px;border-radius:14px;white-space:pre-wrap;line-height:1.45}.user{align-self:flex-end;background:#3a1111}.assistant{align-self:flex-start;background:#121212;border:1px solid #2c2c2c}
    .composer{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(752px,calc(100% - 28px));background:rgba(8,8,8,.96);backdrop-filter:blur(14px);border:1px solid #321313;border-radius:18px;padding:10px}
    .composer textarea{resize:none;min-height:48px;max-height:140px}.tiny{font-size:12px;color:#8f8f8f}.memories{display:grid;gap:8px}.memory{padding:10px;border:1px solid #292929;border-radius:12px;background:#0d0d0d}.memory b{color:#ff6b6b}
    dialog{border:1px solid #3a1717;border-radius:18px;background:#090909;color:#fff;width:min(620px,92vw)}
  </style>
</head>
<body>
<div class="shell">
  <header><h1>ULTRON</h1><div class="status" id="status">Bağlantı kontrol ediliyor…</div></header>
  <section id="login" class="panel hidden">
    <h2>Giriş</h2><p class="tiny">Bu parola yalnızca ULTRON Cloud sunucuna gönderilir.</p>
    <div class="row"><input id="password" type="password" placeholder="ULTRON parolası" autocomplete="current-password"/><button id="loginBtn">Giriş</button></div><p id="loginError" class="tiny"></p>
  </section>
  <main id="app" class="hidden">
    <div class="row" style="margin-top:12px"><button class="secondary" id="memoryBtn">Hafıza</button><button class="secondary" id="logoutBtn">Çıkış</button></div>
    <div id="messages"></div>
    <div class="composer"><div class="row"><textarea id="message" class="grow" placeholder="ULTRON'a yaz…"></textarea><button id="sendBtn">Gönder</button></div><div id="busy" class="tiny" style="padding-top:6px"></div></div>
  </main>
</div>
<dialog id="memoryDialog">
  <h3>Ortak Hafıza</h3>
  <div class="row"><input id="memoryKey" placeholder="Anahtar (örn. laptop_modeli)"/><input id="memoryCategory" placeholder="Kategori" value="FACT"/></div>
  <textarea id="memoryValue" placeholder="Değer" style="margin-top:8px"></textarea>
  <div class="row" style="margin-top:8px"><button id="saveMemory">Kaydet</button><button class="secondary" id="closeMemory">Kapat</button></div>
  <div id="memories" class="memories" style="margin-top:12px"></div>
</dialog>
<script>
const $=s=>document.querySelector(s);let conversationId=localStorage.getItem('ultronConversationId')||'';
async function api(path,options={}){
  let res;
  try{
    res=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});
  }catch(err){
    const e=new Error('Bağlantı geçici olarak koptu. Birkaç saniye sonra tekrar dene.');
    e.network=true;e.cause=err;throw e;
  }
  let data={};try{data=await res.json()}catch{}
  if(!res.ok){const e=new Error(data.error||`HTTP ${res.status}`);e.status=res.status;e.data=data;throw e}
  return data
}
function addMessage(role,content){const d=document.createElement('div');d.className=`msg ${role}`;d.textContent=content;$('#messages').appendChild(d);d.scrollIntoView({block:'end'})}
async function loadMessages(){const d=await api('/api/messages?limit=80');$('#messages').innerHTML='';d.messages.forEach(m=>addMessage(m.role,m.content))}
async function boot(){try{await api('/api/session');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#status').textContent='Cloud bağlı';await loadMessages()}catch(e){$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#status').textContent='Giriş gerekli'}}
$('#loginBtn').onclick=async()=>{try{await api('/api/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});$('#loginError').textContent='';await boot()}catch(e){$('#loginError').textContent='Parola yanlış veya sunucu hazır değil.'}};
$('#logoutBtn').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};
async function send(){const text=$('#message').value.trim();if(!text)return;$('#message').value='';addMessage('user',text);$('#busy').textContent='ULTRON düşünüyor…';$('#sendBtn').disabled=true;try{const d=await api('/api/chat',{method:'POST',body:JSON.stringify({message:text,conversation_id:conversationId||undefined})});conversationId=d.conversation_id;localStorage.setItem('ultronConversationId',conversationId);addMessage('assistant',d.reply)}catch(e){const msg=e.network?'Bağlantı geçici olarak koptu. Mesajın sunucuya ulaşmış olabilir; birkaç saniye sonra sayfayı yenileyip kontrol et.':(e.data?.detail||e.message);addMessage('assistant',`Hata: ${msg}`)}finally{$('#busy').textContent='';$('#sendBtn').disabled=false}}
$('#sendBtn').onclick=send;$('#message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
async function loadMemories(){const d=await api('/api/memories');$('#memories').innerHTML='';d.memories.forEach(m=>{const x=document.createElement('div');x.className='memory';x.innerHTML='<b></b><div></div><small></small>';x.querySelector('b').textContent=`[${m.category}] ${m.key}`;x.querySelector('div').textContent=m.value;x.querySelector('small').textContent=`v${m.version} • ${m.updated_by_device||'cihaz'}`;$('#memories').appendChild(x)})}
$('#memoryBtn').onclick=async()=>{$('#memoryDialog').showModal();await loadMemories()};$('#closeMemory').onclick=()=>$('#memoryDialog').close();
$('#saveMemory').onclick=async()=>{await api('/api/memories',{method:'PUT',body:JSON.stringify({key:$('#memoryKey').value,value:$('#memoryValue').value,category:$('#memoryCategory').value})});$('#memoryKey').value='';$('#memoryValue').value='';await loadMemories()};boot();
</script>
</body>
</html>
