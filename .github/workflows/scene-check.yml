name: ULTRON Scene Build Check

on:
  push:
    branches:
      - feat/ultron-cloud-shared-memory
    paths:
      - "ultron/backend/**"
      - "ultron/frontend/**"
      - "actions/**"
      - "core/**"
      - "integration/**"
      - "scripts/**"
      - "AGENTS.md"
      - "ultron/cloud_service/**"
      - "mark_app.py"
      - ".github/workflows/scene-check.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile changed Python
        run: |
          python -m py_compile ultron/backend/server.py
          python -m py_compile ultron/backend/app/core/fast_brain.py
          python -m py_compile scripts/ultron_fast_brain_doctor.py
          python -m py_compile ultron/backend/app/core/model_router.py
          python -m py_compile ultron/backend/app/core/brain.py
          python -m py_compile ultron/backend/earth_watch.py
          python -m py_compile actions/ultron_stage.py
          python -m py_compile integration/web_panel.py
          python -m py_compile integration/development_bridge.py
          python -m py_compile integration/safe_self_update.py
          python -m py_compile integration/video_dock.py
          python -m py_compile actions/video_player.py
          python -m py_compile ui.py
          python -m py_compile ultron/cloud_service/app.py
          python -m py_compile ultron/cloud_service/local_brain_bridge.py
          python -m py_compile integration/local_cloud_brain.py
          python -m py_compile ultron/cloud_service/world_api.py
          python -m py_compile ultron/cloud_service/development_updates.py
          python -m py_compile ultron/backend/cloud_client.py
          python -m py_compile ultron/backend/cloud_delivery.py
          python -m py_compile ultron/backend/cloud_dispatch_journal.py
          python -m py_compile mark_app.py
      - name: Original MARK embedded video dock regression tests
        run: python -m unittest discover -s scripts/tests -p 'test_mark_video_dock.py' -v
      - name: Actual headless Qt MARK video dock geometry and signals
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libxcb-cursor0 libpulse0
          python -m pip install --disable-pip-version-check 'PyQt6>=6.6,<7'
          python -m unittest discover -s scripts/tests -p 'test_mark_video_dock_qt.py' -v
      - name: Trusted code fast-forward safety tests
        run: python -m unittest discover -s scripts/tests -p 'test_safe_self_update.py' -v
      - name: ULTRON Fast Brain single-pass and Ollama wire regression tests
        env:
          PYTHONPATH: ultron/backend
        run: python -m unittest discover -s ultron/backend/tests -p 'test_fast_brain.py' -v
      - name: ULTRON silent automatic local-first model selection
        run: |
          node --check ultron/cloud_service/static/auto-brain.js
          node --test ultron/cloud_service/test_auto_brain.cjs
      - name: Free PWA local mic + Gemini opt-in regression tests
        run: |
          node --check ultron/cloud_service/static/local-voice.js
          node --test ultron/cloud_service/test_local_voice.cjs
      - name: Paired phone local Ollama tests (no Gemini calls)
        run: |
          python -m unittest discover -s scripts/tests -p 'test_local_cloud_brain.py' -v
          python -m unittest discover -s ultron/cloud_service -p 'test_local_brain_bridge.py' -v
      - name: Earth Watch backend state regression tests
        run: python -m unittest discover -s ultron/backend/tests -p 'test_earth_watch_config.py' -v
      - name: Desktop Cloud lease ownership regression tests
        run: python -m unittest discover -s ultron/backend/tests -p 'test_cloud_delivery_guard.py' -v
      - name: Durable desktop Cloud dispatch regression tests
        run: python -m unittest discover -s ultron/backend/tests -p 'test_cloud_dispatch_journal.py' -v
      - name: Self-development release proof guard regressions
        run: python -m unittest discover -s ultron/cloud_service -p 'test_development_updates.py' -v
      - name: Development GitHub CI Render and desktop proof state-machine tests
        run: python -m unittest discover -s ultron/cloud_service -p 'test_dev_release_proof.py' -v
      - name: Cloud task queue race regression tests
        run: python -m unittest discover -s ultron/cloud_service -p 'test_device_queue_contract.py' -v
      - name: Codex continuation report regression tests
        run: python -m unittest discover -s scripts/tests -p 'test_ultron_dev_resume.py' -v
      - name: Validate developer resume command
        run: python scripts/ultron_dev_resume.py --json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ultron/frontend/package-lock.json
      - name: Development ChatGPT handoff UI contracts
        run: |
          node --check ultron/cloud_service/static/dev-requests.js
          node --test ultron/cloud_service/test_dev_requests_contract.cjs
      - name: iPhone PWA shortcut consent and task indicator tests
        run: |
          node --check ultron/cloud_service/static/mobile-action-guard.js
          node --test ultron/cloud_service/test_mobile_action_guard.cjs
      - name: Owner briefing and honest ten-feature panel tests
        run: |
          node --check ultron/cloud_service/static/personal-panel.js
          node --test ultron/cloud_service/test_personal_panel.cjs
      - name: Manual owner calendar UI controls and permission tests
        run: |
          node --check ultron/cloud_service/static/owner-plans.js
          node --test ultron/cloud_service/test_owner_plans_ui.cjs
      - name: ULTRON owner-approved learning review mobile UI
        run: |
          node --check ultron/cloud_service/static/learning-review.js
          node --test ultron/cloud_service/test_learning_review_ui.cjs
      - name: Optional automatic learning mobile consent toggle
        run: |
          node --check ultron/cloud_service/static/learning-review.js
          node --test ultron/cloud_service/test_auto_learning_ui.cjs
      - name: Minimal phone UI voice/text navigation contracts
        run: |
          node --check ultron/cloud_service/static/panel-intents.js
          node --test ultron/cloud_service/test_panel_intents.cjs
          node --experimental-strip-types --test ultron/frontend/tests/panelIntent.test.mjs
      - name: ULTRON WORLD JavaScript syntax and UI contracts
        run: |
          node --check ultron/cloud_service/static/world.js
          node --test ultron/cloud_service/test_world_contract.cjs
      - name: Install frontend
        working-directory: ultron/frontend
        run: npm ci
      - name: TypeScript and Vite build
        working-directory: ultron/frontend
        run: npm run build
      - name: Earth Watch geographic regression tests
        working-directory: ultron/frontend
        run: npm run test:earth
