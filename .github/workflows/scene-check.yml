name: ULTRON Scene Build Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feat/ultron-cloud-shared-memory
      - feat/golge-natural-conversation-voice-20261014
      - feat/golge-reference-orb-ui-20261013
      - feat/golge-deep-dialog-continuity-20261013
      - feat/golge-qwen-goal-routing-20261013
    paths:
      - "ultron/cloud_service/**"
      - "ultron/frontend/src/dashboard/**"
      - "ultron/frontend/tests/conversationRequestFailure.test.mjs"
      - "ultron/frontend/tests/conversationRequestIdentity.test.mjs"
      - "mark_app.py"
      - "integration/**"
      - "scripts/tests/test_listening_browser.py"
      - "ui.py"
      - "tests/test_setup_overlay.py"
      - ".github/workflows/scene-check.yml"
  push:
    branches:
      - feat/ultron-cloud-shared-memory
      - feat/ultron-listen-prod-compat-20261012
      - feat/ultron-qwen-probe-latest-live-20261013
      - feat/golge-identity-rebrand-20261013
      - feat/golge-deep-dialog-continuity-20261013
      - feat/golge-qwen-goal-routing-20261013
      - feat/golge-temporal-memory-20261013
      - feat/golge-reference-orb-ui-20261013
    paths:
      - "ultron/backend/**"
      - "ultron/frontend/**"
      - "actions/**"
      - "core/**"
      - "integration/**"
      - "scripts/**"
      - "AGENTS.md"
      - "ultron/cloud_service/**"
      - "mark_app.py"
      - "ui.py"
      - "tests/test_setup_overlay.py"
      - ".github/workflows/scene-check.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile changed Python
        run: |
          python -m py_compile ultron/backend/bridge.py
          python -m py_compile ultron/backend/github_pr_publisher.py
          python -m py_compile ultron/backend/codegen.py
          python -m py_compile ultron/backend/server.py
          python -m py_compile ultron/backend/app/core/fast_brain.py
          python -m py_compile ultron/backend/app/agent/agent.py
          python -m py_compile ultron/backend/app/vision/vision_llm.py
          python -m py_compile scripts/ultron_fast_brain_doctor.py
          python -m py_compile ultron/backend/app/core/model_router.py
          python -m py_compile ultron/backend/app/core/brain.py
          python -m py_compile ultron/backend/app/cognitive/research_engine.py
          python -m py_compile ultron/backend/app/cognitive/research_context.py
          python -m py_compile ultron/backend/app/core/intent.py
          python -m py_compile ultron/backend/app/core/runtime.py
          python -m py_compile ultron/backend/earth_watch.py
          python -m py_compile actions/ultron_stage.py
          python -m py_compile integration/web_panel.py
          python -m py_compile integration/development_bridge.py
          python -m py_compile integration/safe_self_update.py
          python -m py_compile integration/video_dock.py
          python -m py_compile actions/video_player.py
          python -m py_compile ui.py
          python -m py_compile ultron/cloud_service/app.py
          python -m py_compile ultron/cloud_service/local_brain_bridge.py
          python -m py_compile integration/local_cloud_brain.py
          python -m py_compile ultron/cloud_service/world_api.py
          python -m py_compile ultron/cloud_service/development_updates.py
          python -m py_compile ultron/backend/cloud_client.py
          python -m py_compile ultron/backend/cloud_delivery.py
          python -m py_compile ultron/backend/cloud_dispatch_journal.py
          python -m py_compile mark_app.py
      - name: Original MARK embedded video dock regression tests
        run: python -m unittest discover -s scripts/tests -p 'test_mark_video_dock.py' -v
      - name: Actual headless Qt MARK video dock geometry and signals
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libxcb-cursor0 libpulse0
          python -m pip install --disable-pip-version-check 'PyQt6>=6.6,<7'
          python -m unittest discover -s scripts/tests -p 'test_mark_video_dock_qt.py' -v
      - name: Trusted code fast-forward safety tests
        run: python -m unittest discover -s scripts/tests -p 'test_safe_self_update.py' -v
      - name: Explicit GÖLGE code-change approval routing
        env:
          PYTHONPATH: ultron/backend
        run: python -m unittest discover -s ultron/backend/tests -p 'test_github_pr_publisher.py' -v
      - name: GÖLGE project-root path boundary regression
        env:
          PYTHONPATH: ultron/backend
        run: python -m unittest discover -s ultron/backend/tests -p 'test_codegen_path_boundary.py' -v
      - name: ULTRON Fast Brain single-pass and Ollama wire regression tests
        env:
          PYTHONPATH: ultron/backend
        run: python -m unittest discover -s ultron/backend/tests -p 'test_fast_brain.py' -v
      - name: Desktop model, agent, vision and merged API privacy regressions
        run: |
          python -m pip install --disable-pip-version-check 'pytest>=8,<9' 'aiohttp>=3.9,<4' 'Pillow>=10' 'psutil>=5'
          python -m pytest -q ultron/backend/tests/test_model_router.py
      - name: SSRF-bounded source reading and 100-case memory research evaluation
        env:
          PYTHONPATH: ultron/backend:ultron/cloud_service
        run: python -m pytest -q ultron/backend/tests/test_wave5_verified_research.py ultron/backend/tests/test_wave5_research_agent.py ultron/backend/tests/test_memory_research_v3_eval.py
      - name: Desktop first-run setup focus and persistence regression
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_setup_overlay.py
      - name: Local Qwen phone mic tap-to-interrupt and stale speech reply guard
        run: |
          node --check ultron/cloud_service/static/voice-turn-guard.js
          node --test ultron/cloud_service/test_voice_turn_guard.cjs
      - name: Validate synthetic-only Qwen owner roundtrip
        run: |
          node --check ultron/cloud_service/static/local-listening-probe.js
          node --test ultron/cloud_service/test_local_listening_probe.cjs
      - name: Single ULTRON speaker arbitration on phone and laptop
        run: |
          node --check ultron/cloud_service/static/speaker-policy.js
          node --test ultron/cloud_service/test_speaker_policy.cjs
      - name: Live voice barge-in and graceful final audio queue tests
        run: |
          node --check ultron/cloud_service/static/live-playback.js
          node --test ultron/cloud_service/test_live_playback.cjs
      - name: ULTRON silent automatic local-first model selection
        run: |
          node --check ultron/cloud_service/static/auto-brain.js
          node --test ultron/cloud_service/test_auto_brain.cjs
      - name: Free PWA local mic + Gemini opt-in regression tests
        run: |
          node --check ultron/cloud_service/static/local-voice.js
          node --test ultron/cloud_service/test_local_voice.cjs
      - name: Paired phone local Ollama tests (no Gemini calls)
        run: |
          python -m unittest discover -s scripts/tests -p 'test_local_cloud_brain.py' -v
          python -m unittest discover -s ultron/cloud_service -p 'test_local_brain_bridge.py' -v
      - name: GÖLGE 35-turn goal-to-Qwen route regression suite
        run: python -m unittest discover -s scripts/tests -p 'test_golge_qwen_goal_routing.py' -v
      - name: Earth Watch backend state regression tests
        run: python -m unittest discover -s ultron/backend/tests -p 'test_earth_watch_config.py' -v
      - name: Desktop Cloud lease ownership regression tests
        run: python -m unittest discover -s ultron/backend/tests -p 'test_cloud_delivery_guard.py' -v
      - name: Durable desktop Cloud dispatch regression tests
        run: python -m unittest discover -s ultron/backend/tests -p 'test_cloud_dispatch_journal.py' -v
      - name: GÖLGE shared saved-memory focus during bare continuation
        env:
          PYTHONPATH: ultron/cloud_service:.
        run: python -m unittest ultron.cloud_service.test_golge_memory_focus_continuity -v
      - name: GÖLGE date-aware personal-memory selection regressions
        env:
          PYTHONPATH: ultron/cloud_service:.
        run: |
          python -m py_compile ultron/cloud_service/personal_context_focus.py
          python -m unittest -v ultron.cloud_service.test_golge_temporal_memory ultron.cloud_service.test_personal_context_focus
      - name: GÖLGE goal continuity across long conversations
        env:
          PYTHONPATH: ultron/cloud_service:.
        run: |
          python -m py_compile ultron/cloud_service/conversation_turns.py
          python -m py_compile ultron/cloud_service/conversation_persona.py
          python -m unittest -q ultron.cloud_service.test_golge_long_continuity
          python -m unittest -q ultron.cloud_service.test_contextual_recall ultron.cloud_service.test_conversation_persona
      - name: Self-development release proof guard regressions
        run: python -m unittest discover -s ultron/cloud_service -p 'test_development_updates.py' -v
      - name: Development GitHub CI Render and desktop proof state-machine tests
        run: python -m unittest discover -s ultron/cloud_service -p 'test_dev_release_proof.py' -v
      - name: Cloud task queue race regression tests
        run: python -m unittest discover -s ultron/cloud_service -p 'test_device_queue_contract.py' -v
      - name: Codex continuation report regression tests
        run: python -m unittest discover -s scripts/tests -p 'test_ultron_dev_resume.py' -v
      - name: Validate developer resume command
        run: python scripts/ultron_dev_resume.py --json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ultron/frontend/package-lock.json
      - name: Development ChatGPT handoff UI contracts
        run: |
          node --check ultron/cloud_service/static/dev-requests.js
          node --test ultron/cloud_service/test_dev_requests_contract.cjs
      - name: iPhone PWA shortcut consent and task indicator tests
        run: |
          node --check ultron/cloud_service/static/mobile-action-guard.js
          node --test ultron/cloud_service/test_mobile_action_guard.cjs
      - name: Owner briefing and honest ten-feature panel tests
        run: |
          node --check ultron/cloud_service/static/personal-panel.js
          node --test ultron/cloud_service/test_personal_panel.cjs
      - name: Manual owner calendar UI controls and permission tests
        run: |
          node --check ultron/cloud_service/static/owner-plans.js
          node --test ultron/cloud_service/test_owner_plans_ui.cjs
      - name: ULTRON owner-approved learning review mobile UI
        run: |
          node --check ultron/cloud_service/static/learning-review.js
          node --test ultron/cloud_service/test_learning_review_ui.cjs
      - name: Optional automatic learning mobile consent toggle
        run: |
          node --check ultron/cloud_service/static/learning-review.js
          node --test ultron/cloud_service/test_auto_learning_ui.cjs
      - name: Minimal phone UI voice/text navigation contracts
        run: |
          node --check ultron/cloud_service/static/panel-intents.js
          node --test ultron/cloud_service/test_panel_intents.cjs
          node --experimental-strip-types --test ultron/frontend/tests/panelIntent.test.mjs
      - name: ULTRON conversation notes on-demand editor and PWA
        run: |
          node --check ultron/cloud_service/static/conversation-notes.js
          node --test ultron/cloud_service/test_conversation_notes_ui.cjs
      - name: ULTRON WORLD JavaScript syntax and UI contracts
        run: |
          node --check ultron/cloud_service/static/world.js
          node --test ultron/cloud_service/test_world_contract.cjs
      - name: Install frontend
        working-directory: ultron/frontend
        run: npm ci
      - name: Conversation interruption state contracts
        working-directory: ultron/frontend
        run: node --experimental-strip-types --test tests/conversationRequestFailure.test.mjs tests/conversationRequestIdentity.test.mjs
      - name: TypeScript and Vite build
        working-directory: ultron/frontend
        run: npm run build
      - name: Keep WebGL center stage out of initial dashboard bundle
        working-directory: ultron/frontend
        run: npm run test:bundle
      - name: Earth Watch geographic regression tests
        working-directory: ultron/frontend
        run: npm run test:earth
      - name: Natural 3D scene grammar and saved-project transforms
        run: |
          node scripts/test_scene_intents.mjs
          node scripts/test_scene_design.mjs
          PYTHONPATH=ultron/cloud_service python -m unittest ultron/cloud_service/test_scene_design.py -v
          node scripts/test_hologram_project.mjs
          node scripts/build_scene_browser.mjs
          git diff --exit-code -- ultron/cloud_service/static/scene-control.js ultron/cloud_service/static/scene-intents.js
      - name: Install actual WebGL browser verification
        run: |
          python -m pip install aiohttp playwright
          python -m playwright install --with-deps chromium
      - name: Mobile and desktop actual 3D scene interactions
        run: |
          PYTHONPATH=ultron/cloud_service python -m unittest ultron/cloud_service/test_scene_assets.py -v
          PYTHONPATH=. python scripts/tests/test_scene_desktop_api.py
          python scripts/tests/test_scene_browser.py
          python scripts/tests/test_frontend_stage_loading.py
      - name: Mobile listening consent and full-summary browser interaction
        run: python scripts/tests/test_listening_browser.py
      - name: GÖLGE private generated-image reload and download UI contract
        run: node ultron/cloud_service/test_image_generation_ui.cjs
      - name: GÖLGE screenshot-matched mobile and laptop layout contracts
        run: node --test ultron/cloud_service/test_golge_reference_ui.cjs
      - name: GÖLGE mobile visual composition in real Chromium
        run: python scripts/tests/test_golge_reference_browser.py
      - name: GÖLGE visible identity and legacy protocol compatibility
        run: |
          node --test ultron/cloud_service/test_golge_identity.cjs
          PYTHONPATH=ultron/cloud_service:. python -m unittest ultron.cloud_service.test_golge_identity -v
          PYTHONPATH=ultron/cloud_service:. python -m unittest ultron.cloud_service.test_golge_visible_brand_contract -v
          python -m unittest discover -s ios/ULTRONMobile/tests -p 'test_siri_bridge_contract.py' -v
