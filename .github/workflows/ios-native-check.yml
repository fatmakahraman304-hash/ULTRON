name: Native iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/ultron-cloud-shared-memory
    paths:
      - "ios/ULTRONMobile/**"
      - ".github/workflows/ios-native-check.yml"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siri and Shortcuts permission contract regression tests
        run: python3 -m unittest discover -s ios/ULTRONMobile/tests -p 'test_*.py' -v

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/ULTRONMobile
        run: xcodegen generate

      - name: Build iOS Simulator
        working-directory: ios/ULTRONMobile
        run: |
          set -o pipefail
          xcodebuild \
            -project ULTRONMobile.xcodeproj \
            -scheme ULTRONMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ultron-sim" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iPhone app
        working-directory: ios/ULTRONMobile
        run: |
          set -o pipefail
          xcodebuild \
            -project ULTRONMobile.xcodeproj \
            -scheme ULTRONMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ultron-device" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/ultron-device/Build/Products/Release-iphoneos/ULTRONMobile.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ultron-ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ultron-ipa/Payload/"
          cd "$RUNNER_TEMP/ultron-ipa"
          /usr/bin/zip -qry "$RUNNER_TEMP/ULTRONMobile-unsigned.ipa" Payload
          ls -lh "$RUNNER_TEMP/ULTRONMobile-unsigned.ipa"

      - name: Package Xcode project
        working-directory: ios/ULTRONMobile
        run: |
          /usr/bin/zip -qry "$RUNNER_TEMP/ULTRONMobile-XcodeProject.zip" ULTRONMobile.xcodeproj Sources project.yml README_TR.md

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ULTRONMobile-unsigned-IPA
          path: ${{ runner.temp }}/ULTRONMobile-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: ULTRONMobile-XcodeProject
          path: ${{ runner.temp }}/ULTRONMobile-XcodeProject.zip
          if-no-files-found: error
          retention-days: 14
