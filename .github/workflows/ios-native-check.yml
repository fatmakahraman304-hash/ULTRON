name: Native iOS Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/ultron-cloud-shared-memory
    paths:
      - "ios/ULTRONMobile/**"
      - ".github/workflows/ios-native-check.yml"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/ULTRONMobile
        run: xcodegen generate

      - name: Build iOS Simulator
        working-directory: ios/ULTRONMobile
        run: |
          set -o pipefail
          xcodebuild \
            -project ULTRONMobile.xcodeproj \
            -scheme ULTRONMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
