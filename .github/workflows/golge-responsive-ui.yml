name: GÖLGE Responsive Interface Check

on:
  push:
    branches:
      - feat/golge-minimal-responsive-ui-20261013
      - feat/golge-render-release-20261013
  pull_request:
    branches:
      - feat/golge-qwen-goal-routing-20261013
      - feat/ultron-cloud-shared-memory
      - feat/golge-natural-conversation-voice-20261014
    paths:
      - 'ultron/frontend/**'
      - 'ultron/cloud_service/static/index.html'
      - 'ultron/cloud_service/static/golge-minimal.css'
      - 'ultron/cloud_service/static/golge-reference-mobile.css'
      - 'ultron/cloud_service/static/golge-night-lake.webp'
      - 'ultron/cloud_service/static/sw.js'
      - 'ultron/cloud_service/test_golge_reference_ui.cjs'
      - 'scripts/test_golge_minimal_ui.mjs'
      - '.github/workflows/golge-responsive-ui.yml'

permissions:
  contents: read

jobs:
  responsive-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ultron/frontend/package-lock.json
      - name: Assert mobile and laptop integration contracts
        run: node scripts/test_golge_minimal_ui.mjs
      - name: Syntax-check the PWA service worker
        run: node --check ultron/cloud_service/static/sw.js
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ultron/frontend
      - name: TypeScript and Vite production build
        run: npm run build
        working-directory: ultron/frontend
      - name: Dashboard workspace, live CORE and deterministic network contracts
        run: node --experimental-strip-types --test ultron/frontend/tests/panelIntent.test.mjs ultron/frontend/tests/coreNetwork.test.mjs ultron/frontend/tests/connectionStatus.test.mjs ultron/frontend/tests/earthIntent.test.mjs ultron/frontend/tests/earthMath.test.mjs ultron/frontend/tests/manualFailures.test.mjs
      - name: Cloud PWA fixed-wallpaper and mobile-chat contracts
        run: node --test ultron/cloud_service/test_golge_reference_ui.cjs
