name: GÖLGE Desktop Chat Regression

on:
  pull_request:
    branches:
      - feat/ultron-cloud-shared-memory
    paths:
      - "ultron/backend/merged_api.py"
      - "ultron/backend/app/core/desktop_intents.py"
      - "ultron/backend/tests/test_desktop_chat_intents.py"
      - ".github/workflows/golge-desktop-chat.yml"
  push:
    branches:
      - feat/ultron-cloud-shared-memory
    paths:
      - "ultron/backend/merged_api.py"
      - "ultron/backend/app/core/desktop_intents.py"
      - "ultron/backend/tests/test_desktop_chat_intents.py"
      - ".github/workflows/golge-desktop-chat.yml"
  workflow_dispatch:

jobs:
  desktop-chat-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: ".:ultron/backend"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API test prerequisites
        run: python -m pip install --disable-pip-version-check "aiohttp>=3.9,<4" "asyncpg>=0.30,<1" "google-genai>=1,<2"
      - name: Compile changed code
        run: python -m py_compile ultron/backend/app/core/desktop_intents.py ultron/backend/merged_api.py ultron/backend/tests/test_desktop_chat_intents.py
      - name: Check allowlisted tool execution and runtime model identity
        run: python -m unittest discover -s ultron/backend/tests -p 'test_desktop_chat_intents.py' -v
