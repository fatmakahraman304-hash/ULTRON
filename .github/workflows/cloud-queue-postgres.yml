name: Cloud Queue PostgreSQL Integration

on:
  pull_request:
    branches:
      - feat/ultron-cloud-shared-memory
      - feat/golge-qwen-goal-routing-20261013
    paths:
      - "ultron/cloud_service/**"
      - ".github/workflows/cloud-queue-postgres.yml"
  push:
    branches:
      - feat/ultron-cloud-shared-memory
      - feat/golge-temporal-memory-20261013
      - feat/golge-memory-focus-continuity-20261013
    paths:
      - "ultron/cloud_service/**"
      - "integration/local_cloud_brain.py"
      - "ultron/backend/cloud_client.py"
      - "ultron/backend/tests/test_cloud_delivery_guard.py"
      - "scripts/tests/test_qwen_browser.py"
      - "mark_app.py"
      - "evals/conversation/**"
      - "ultron/backend/app/agent/persona_guard.py"
      - "ultron/backend/app/agent/agent.py"
      - "ultron/backend/tests/test_persona_warmth.py"
      - ".github/workflows/cloud-queue-postgres.yml"
  workflow_dispatch:

jobs:
  persona-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight HTTP handler dependency
        run: python -m pip install --disable-pip-version-check "aiohttp>=3.9,<4"
      - name: Test consistent personality and memory boundaries
        run: python -m unittest discover -s ultron/cloud_service -p 'test_conversation_persona.py' -v
      - name: Natural conversation threading and realistic persona regression
        run: python -m unittest discover -s ultron/cloud_service -p 'test_conversation_turns.py' -v
      - name: Local 4GB Qwen natural dialogue request and safe sampling
        run: python -m unittest discover -s ultron/cloud_service -p 'test_local_dialogue_runtime.py' -v
      - name: Context-aware natural dialogue and no-hallucinated-history contracts
        run: python -m unittest discover -s ultron/cloud_service -p 'test_conversation_style.py' -v
      - name: Explicit on-demand older conversation recap, provider-free tests
        run: python -m unittest discover -s ultron/cloud_service -p 'test_thread_recap.py' -v
      - name: Cheap response quality and honest evaluation infrastructure
        run: |
          python -m unittest discover -s ultron/cloud_service -p 'test_response_quality.py' -v
          python -m unittest discover -s ultron/cloud_service -p 'test_conversation_eval.py' -v
          python evals/conversation/run.py --validate
      - name: No unscoped legacy image or document chat history
        run: python -m unittest discover -s ultron/cloud_service -p 'test_recent_context_isolation.py' -v
      - name: Gemini image generation ownership and failed-request cleanup
        run: python -m unittest discover -s ultron/cloud_service -p 'test_image_generation.py' -v
      - name: First topic return and bounded paired recall
        run: python -m unittest discover -s ultron/cloud_service -p 'test_reference_return.py' -v
      - name: Long chat contextual recall and no cross-thread contamination
        run: python -m unittest discover -s ultron/cloud_service -p 'test_contextual_recall.py' -v
      - name: Owner-reviewed conversation notes preview and input validation
        run: python -m unittest discover -s ultron/cloud_service -p 'test_conversation_notes.py' -v
      - name: JARVIS-style topic-aware memory and intelligent local Qwen routing
        run: python -m unittest discover -s ultron/cloud_service -p 'test_personal_context_focus.py' -v
      - name: GÖLGE temporal plan retrieval and stale-memory labeling
        run: python -m unittest discover -s ultron/cloud_service -p 'test_golge_temporal_memory.py' -v
      - name: GÖLGE owner-goal memory focus without data cross-contamination
        run: python -m unittest discover -s ultron/cloud_service -p 'test_golge_memory_focus_continuity.py' -v
      - name: Ten-capability readiness truthfulness tests
        run: python -m unittest discover -s ultron/cloud_service -p 'test_capability_readiness.py' -v
      - name: Personal briefing privacy and grounding tests
        run: python -m unittest discover -s ultron/cloud_service -p 'test_personal_briefing.py' -v
      - name: Owner iCalendar privacy, timezone and format contracts
        run: python -m unittest discover -s ultron/cloud_service -p 'test_personal_calendar_ics.py' -v
      - name: Manual calendar validation and memory-briefing safety
        run: python -m unittest discover -s ultron/cloud_service -p 'test_personal_plans.py' -v
      - name: Owner-approved learning field and memory boundaries
        run: python -m unittest discover -s ultron/cloud_service -p 'test_approved_learning.py' -v
      - name: Preference conflicts, deduplication and common secret rejection
        run: python -m unittest discover -s ultron/cloud_service -p 'test_memory_safety.py' -v
      - name: Opt-in owner chat automatic learning and secret filters
        run: python -m unittest discover -s ultron/cloud_service -p 'test_auto_learning.py' -v
      - name: Desktop respectful personality regression
        env:
          PYTHONPATH: ultron/backend
        run: python -m unittest discover -s ultron/backend/tests -p 'test_persona_warmth.py' -v
  postgres-fencing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: ultron_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: ultron_queue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ultron_test -d ultron_queue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install disposable DB driver
        run: python -m pip install "asyncpg>=0.29,<1" "aiohttp>=3.9,<4"
      - name: ULTRON personality and memory boundary tests
        run: python -m unittest discover -s ultron/cloud_service -p 'test_conversation_persona.py' -v
      - name: Real PostgreSQL delivery fencing integration
        env:
          ULTRON_QUEUE_TEST_DATABASE_URL: postgresql://ultron_test:local_ci_only@localhost:5432/ultron_queue_test
        run: python -m unittest discover -s ultron/cloud_service -p 'test_device_queue_postgres.py' -v
      - name: Real PostgreSQL owner calendar CRUD and tenant isolation
        env:
          ULTRON_QUEUE_TEST_DATABASE_URL: postgresql://ultron_test:local_ci_only@localhost:5432/ultron_queue_test
        run: python -m unittest discover -s ultron/cloud_service -p 'test_personal_plans_postgres.py' -v
      - name: Real PostgreSQL consent-reviewed learning and cross-owner isolation
        env:
          ULTRON_QUEUE_TEST_DATABASE_URL: postgresql://ultron_test:local_ci_only@localhost:5432/ultron_queue_test
        run: python -m unittest discover -s ultron/cloud_service -p 'test_approved_learning_postgres.py' -v
      - name: Real PostgreSQL default-off auto learning and owner isolation
        env:
          ULTRON_QUEUE_TEST_DATABASE_URL: postgresql://ultron_test:local_ci_only@localhost:5432/ultron_queue_test
        run: python -m unittest discover -s ultron/cloud_service -p 'test_auto_learning_postgres.py' -v
      - name: Real PostgreSQL relevant personal memory, plan priority and owner isolation
        env:
          ULTRON_QUEUE_TEST_DATABASE_URL: postgresql://ultron_test:local_ci_only@localhost:5432/ultron_queue_test
        run: python -m unittest discover -s ultron/cloud_service -p 'test_personal_context_focus_postgres.py' -v
      - name: Private generated images on real PostgreSQL, quota and tenant isolation
        env:
          ULTRON_QUEUE_TEST_DATABASE_URL: postgresql://ultron_test:local_ci_only@localhost:5432/ultron_queue_test
        run: python -m unittest discover -s ultron/cloud_service -p 'test_generated_images_postgres.py' -v
      - name: Real PostgreSQL 36-turn goal to saved-memory recall and account isolation
        env:
          ULTRON_QUEUE_TEST_DATABASE_URL: postgresql://ultron_test:local_ci_only@localhost:5432/ultron_queue_test
        run: python -m unittest discover -s ultron/cloud_service -p 'test_golge_memory_focus_postgres.py' -v
      - name: Real PostgreSQL natural conversation tenant/thread isolation
        env:
          ULTRON_QUEUE_TEST_DATABASE_URL: postgresql://ultron_test:local_ci_only@localhost:5432/ultron_queue_test
        run: python -m unittest discover -s ultron/cloud_service -p 'test_conversation_turns_postgres.py' -v
      - name: Real PostgreSQL private conversation notes consent and owner boundaries
        env:
          ULTRON_QUEUE_TEST_DATABASE_URL: postgresql://ultron_test:local_ci_only@localhost:5432/ultron_queue_test
        run: python -m unittest discover -s ultron/cloud_service -p 'test_conversation_notes_postgres.py' -v
      - name: Real PostgreSQL free local-brain conversation, privacy and reply persistence
        env:
          ULTRON_QUEUE_TEST_DATABASE_URL: postgresql://ultron_test:local_ci_only@localhost:5432/ultron_queue_test
        run: python -m unittest discover -s ultron/cloud_service -p 'test_local_brain_postgres.py' -v
      - name: Real PostgreSQL ChatGPT development request scope and authorization
        env:
          ULTRON_QUEUE_TEST_DATABASE_URL: postgresql://ultron_test:local_ci_only@localhost:5432/ultron_queue_test
        run: python -m unittest discover -s ultron/cloud_service -p 'test_dev_requests_postgres.py' -v
      - name: Install real-browser test dependencies
        run: |
          python -m pip install -r ultron/cloud_service/requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Isolated scene queue privacy and idempotency
        env:
          ULTRON_QUEUE_TEST_DATABASE_URL: postgresql://ultron_test:local_ci_only@localhost:5432/ultron_queue_test
        run: PYTHONPATH=ultron/cloud_service python -m unittest ultron/cloud_service/test_scene_queue_postgres.py -v
      - name: Authenticated data-only scene synthesis
        run: PYTHONPATH=ultron/cloud_service python -m unittest ultron/cloud_service/test_scene_design.py ultron/cloud_service/test_scene_design_api.py -v
      - name: Generated image authenticated HTTP download and no-false-success API
        run: PYTHONPATH=ultron/cloud_service python -m unittest discover -s ultron/cloud_service -p 'test_image_generation.py' -v
      - name: Chromium mobile chat with real queue and explicit fake providers
        env:
          ULTRON_QUEUE_TEST_DATABASE_URL: postgresql://ultron_test:local_ci_only@localhost:5432/ultron_queue_test
        run: python scripts/tests/test_qwen_browser.py
      - name: Bounded transport and desktop executor isolation
        run: |
          node --test ultron/cloud_service/test_mobile_chat_flow.cjs
          python -m unittest discover -s ultron/backend/tests -p 'test_cloud_delivery_guard.py' -v
